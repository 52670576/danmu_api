name: Build Linux ARM Binary

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置QEMU以支持多平台构建
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 设置Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 构建Linux ARMv7二进制文件
      - name: Build Linux ARMv7 binary
        run: |
          # 显示当前工作目录
          pwd
          
          # 创建一个包含Node.js和项目的Docker镜像
          docker build --platform linux/arm/v7 -t danmu-api-armv7 -f - . << 'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY . .
          RUN npm install
          RUN npm run build-forward-widget
          EOF
          
          # 从镜像中提取必要的文件
          docker create --name temp-armv7 danmu-api-armv7
          docker cp temp-armv7:/app /tmp/app-armv7
          docker rm temp-armv7
          
          # 创建包含Node.js和项目的自包含包
          cd /tmp/app-armv7
          tar -czf /tmp/danmu-api-linux-arm.tar.gz .
          
          # 创建启动脚本
          echo '#!/bin/sh
          cd "$(dirname "$0")"
          if [ -f node ]; then
            ./node danmu_api/server.js
          else
            node danmu_api/server.js
          fi' > /tmp/app-armv7/start.sh
          chmod +x /tmp/app-armv7/start.sh
          
          # 复制到工作目录
          cp /tmp/app-armv7/start.sh "${GITHUB_WORKSPACE}/danmu-api-linux-arm"
          chmod +x "${GITHUB_WORKSPACE}/danmu-api-linux-arm"
          
          # 检查文件是否存在
          ls -la "${GITHUB_WORKSPACE}"

      # 构建Linux ARM64二进制文件
      - name: Build Linux ARM64 binary
        run: |
          # 显示当前工作目录
          pwd
          
          # 创建一个包含Node.js和项目的Docker镜像
          docker build --platform linux/arm64 -t danmu-api-arm64 -f - . << 'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY . .
          RUN npm install
          RUN npm run build-forward-widget
          EOF
          
          # 从镜像中提取必要的文件
          docker create --name temp-arm64 danmu-api-arm64
          docker cp temp-arm64:/app /tmp/app-arm64
          docker rm temp-arm64
          
          # 创建包含Node.js和项目的自包含包
          cd /tmp/app-arm64
          tar -czf /tmp/danmu-api-linux-arm64.tar.gz .
          
          # 创建启动脚本
          echo '#!/bin/sh
          cd "$(dirname "$0")"
          if [ -f node ]; then
            ./node danmu_api/server.js
          else
            node danmu_api/server.js
          fi' > /tmp/app-arm64/start.sh
          chmod +x /tmp/app-arm64/start.sh
          
          # 复制到工作目录
          cp /tmp/app-arm64/start.sh "${GITHUB_WORKSPACE}/danmu-api-linux-arm64"
          chmod +x "${GITHUB_WORKSPACE}/danmu-api-linux-arm64"
          
          # 检查文件是否存在
          ls -la "${GITHUB_WORKSPACE}"

      # 查看构建结果
      - name: Check build results
        run: ls -la

      # 上传构建产物
      - name: Upload Linux ARM binary
        uses: actions/upload-artifact@v4
        with:
          name: danmu-api-linux-arm
          path: danmu-api-linux-arm

      - name: Upload Linux ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: danmu-api-linux-arm64
          path: danmu-api-linux-arm64
