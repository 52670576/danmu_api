name: Build Linux Binary

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置Node.js环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 安装依赖
      - name: Install dependencies
        run: npm install

      # 构建项目
      - name: Build project
        run: npm run build-forward-widget

      # 安装pkg工具
      - name: Install pkg
        run: npm install -g pkg

      # 打包为Linux ARM二进制文件
      - name: Package for Linux ARM
        run: |
          pkg . --targets node18-linux-armv7 --output danmu-api-linux-arm

      # 打包为Linux ARM64二进制文件
      - name: Package for Linux ARM64
        run: |
          pkg . --targets node18-linux-arm64 --output danmu-api-linux-arm64

      # 修复文件权限
      - name: Fix file permissions
        run: |
          chmod +x danmu-api-linux-arm
          chmod +x danmu-api-linux-arm64

      # 查看构建结果
      - name: Check build results
        run: ls -la

      # 上传构建产物
      - name: Upload Linux ARM binary
        uses: actions/upload-artifact@v4
        with:
          name: danmu-api-linux-arm
          path: danmu-api-linux-arm

      - name: Upload Linux ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: danmu-api-linux-arm64
          path: danmu-api-linux-arm64
